# nixpacks.toml

[phases.setup]
# Asegúrate de que el binario tiene permisos de ejecución
commands = ["chmod +x /app/pocketbase"]

[phases.start]
# Comando para ejecutar PocketBase
commands = ["/app/pocketbase serve --http 0.0.0.0:8090"]

[dependencies]
# Puedes añadir dependencias si las necesitas, pero PocketBase no tiene dependencias adicionales por defecto.
packages = []

[environment]
# Definir el puerto que será expuesto
EXPOSE_PORT = "8090"
